{{- /*
Secrets are computed through helpers that read any existing Secret back first,
so a `helm upgrade` preserves them.

This matters more than it looks. If credential-secret regenerates, every node
credential already encrypted onto the PVC becomes undecryptable and every broker
password in every flow is gone. A plain randAlphaNum here would do that on the
first upgrade, and it would look like a working deploy until somebody noticed
their MQTT nodes could not authenticate.
*/}}
{{- $password := include "emberwire-app.adminPassword" . -}}
{{- $hash := include "emberwire-app.adminPasswordHash" . -}}
{{- $credSecret := include "emberwire-app.credentialSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "emberwire-app.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "emberwire-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Kept so an operator can retrieve the generated login, and so that an upgrade
  # can preserve it rather than issuing a new one.
  admin-password: {{ $password | b64enc | quote }}
  admin-password-hash: {{ $hash | b64enc | quote }}
  credential-secret: {{ $credSecret | b64enc | quote }}
