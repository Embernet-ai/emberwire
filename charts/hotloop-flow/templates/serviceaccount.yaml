{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hotloop-flow.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hotloop-flow.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# HotLoop Flow talks to no Kubernetes API. Mounting a token it never uses just
# hands an attacker a credential if they get into the container.
automountServiceAccountToken: false
{{- end }}
