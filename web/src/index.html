<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberwire</title>
<script>
// FOUC guard. Runs before the stylesheet is applied, so a dark-mode user never
// sees a white flash. Same approach as the dashboard's view_admin.html.
(function () {
  try {
    var stored = localStorage.getItem('theme');
    var dark = stored ? stored === 'dark'
                      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark-mode-pending');
  } catch (e) { /* private mode; fall through to light */ }
})();
</script>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="app"></div>
<script type="module" src="main.js"></script>
</body>
</html>
