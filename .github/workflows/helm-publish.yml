name: Publish Helm Chart

# Version tags only, same rule as the image.
#
# A chart published off a branch push has whatever version Chart.yaml happened
# to say at the time, so two different charts can claim the same version and the
# index quietly serves the second one. The tag is the version — it is written
# into Chart.yaml at package time, so the chart and the image it references can
# never disagree.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write
  pages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/emberwire-app

      - name: Store labels are on the pod AND the Service
        # THE BIG FOUR, twice — the set defined by the canonical embernet-app
        # template in helm-chart-temps, and nothing beyond it. Labels on the pod
        # alone make the app show in node detail and stay invisible in the
        # Running Apps catalogue, which is the most common silent App Store
        # failure and is not visible from reading the chart.
        run: |
          COUNT=$(helm template t charts/emberwire-app | grep -c 'embernet\.ai/store-app\|embernet\.ai/gui-type\|embernet\.ai/app-name\|embernet\.ai/gui-port')
          echo "store labels rendered: $COUNT"
          if [ "$COUNT" -ne 8 ]; then
            echo "::error::expected 8 store labels (4 on the pod, 4 on the Service), found $COUNT"
            exit 1
          fi

      - name: No store labels beyond the canonical set
        # An extra embernet.ai/* label on the workload is not additive, it is
        # drift. The dashboard reads a fixed set; anything else is dead weight
        # that the next person has to work out the provenance of. This chart
        # shipped an invented embernet.ai/chart-name and a tenantLabels helper
        # until they were removed — nothing read either, and the tenant label is
        # the dashboard's to apply, not the chart's.
        run: |
          EXTRA=$(helm template t charts/emberwire-app             | grep -oE 'embernet\.ai/[a-z-]+'             | sort -u             | grep -vE 'embernet\.ai/(store-app|gui-type|app-name|gui-port|display-name|app-icon)$' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::chart renders embernet.ai labels outside the canonical set: $EXTRA"
            exit 1
          fi

      - name: Chart name must not contain "pod"
        # Standing App Store rule. The dashboard carries a deny-list for the old
        # -pod names precisely because renaming one after publication leaves a
        # duplicate card in the catalogue forever.
        run: |
          NAME=$(grep '^name:' charts/emberwire-app/Chart.yaml | awk '{print $2}')
          case "$NAME" in
            *pod*) echo "::error::chart name '$NAME' contains 'pod'"; exit 1 ;;
            *) echo "chart name: $NAME" ;;
          esac

      - name: Every network mode renders
        run: |
          helm template t charts/emberwire-app >/dev/null
          helm template t charts/emberwire-app --set network.mode=host >/dev/null
          helm template t charts/emberwire-app \
            --set network.mode=macvlan \
            --set network.macvlan.master=eth1 \
            --set network.macvlan.ipam.subnet=10.20.30.0/24 >/dev/null

      - name: Bad configurations are refused
        # A guard that does not fire is worse than no guard: it reads as
        # validated. Assert each one actually fails.
        run: |
          fails() {
            if helm template t charts/emberwire-app "$@" >/dev/null 2>&1; then
              echo "::error::expected this to be rejected: $*"
              exit 1
            fi
          }
          fails --set network.mode=nonsense
          fails --set network.mode=macvlan --set network.macvlan.master=eth1
          fails --set discovery.enabled=true

  publish:
    name: Publish
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: azure/setup-helm@v4

      - name: Refuse to publish anything that is not a version tag
        run: |
          REF='${{ inputs.tag || github.ref_name }}'
          case "$REF" in
            v[0-9]*) echo "publishing $REF" ;;
            *) echo "::error::refusing to publish '$REF' — charts are published from version tags only"; exit 1 ;;
          esac

      - name: Package at the tagged version
        # --version and --app-version rather than editing Chart.yaml in the
        # repo: the tag is the single source of truth for what this release is,
        # and a committed version that drifts from the tag is how an index ends
        # up with two different charts claiming one version.
        run: |
          VERSION='${{ inputs.tag || github.ref_name }}'
          VERSION="${VERSION#v}"
          mkdir -p .deploy
          helm package charts/emberwire-app -d .deploy \
            --version "$VERSION" --app-version "$VERSION"

      - name: Build the index
        # Current-version-only: do NOT merge the live index. Merging carries
        # forward stale versions whose tarballs may 404, and a chart renamed in
        # place gets resurrected under its old name forever. Prior versions
        # predate the App Store contract and must not be resolvable.
        run: |
          helm repo index .deploy --url https://embernet-ai.github.io/emberwire/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .deploy
          keep_files: true
